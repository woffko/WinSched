schema_version = 4
controller_mode = "observe"
sample_interval_ms = 1000
minimum_process_utilization_bps = 500
all_user_processes = false
default_rule_mode = "auto"
default_workload_profile = "balanced"

[logging]
enabled = true
max_file_size_mib = 10
retained_archives = 1

[background_efficiency]
enabled = false
# Process-level policies stay opt-in for known leaf workloads. Native acceptance
# observed memory priority propagating to children created by a tagged parent.
eco_qos_enabled = false
# Parent rollback cannot retroactively restore a live child, and restoring the
# process default cannot retag pages populated in the interim.
memory_priority_enabled = false
memory_pressure_guard_enabled = true
protect_foreground = true
protect_visible = true
protect_audio = true

[responsiveness]
enabled = false
system_reserve_percent = 10
minimum_reserved_cores = 2
maximum_reserved_cores = 8
latency_guard_enabled = true
latency_target_p99_us = 2000
latency_recovery_p99_us = 1000
adjustment_stability_samples = 5

[responsiveness.memory]
use_smt = false
minimum_physical_cores = 8
maximum_physical_cores = 28
resize_cooldown_ms = 300000

[policy]
overload_threshold_bps = 8500
minimum_improvement_bps = 2000
stability_samples = 3
minimum_residency_ms = 10000
cooldown_ms = 30000
max_mutations_per_evaluation = 1

[[rules]]
image = "winsched.exe"
mode = "auto"
profile = "balanced"

# Background efficiency is applied only to an exact rule with profile = "background".
# Keep interactive applications and VM/WSL hosts out unless you have tested the workload.
# [[rules]]
# image = "renderer.exe"
# mode = "auto"
# profile = "background"
